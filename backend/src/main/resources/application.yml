server:
  port: 8080                 # port du serveur Tomcat embarqué (8080 est aussi la valeur par défaut)

spring:
  application:
    name: order-service

  # Base H2 en mémoire : rien à installer, effacée à chaque redémarrage
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console (JDBC URL : jdbc:h2:mem:orders)

  mvc:
    problemdetails:
      enabled: true          # erreurs au format standard RFC 7807

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Le JSON est produit par l'application (ObjectMapper) et stocké tel quel dans la table outbox :
      # Kafka reçoit donc une chaîne déjà sérialisée.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000     # si Kafka est arrêté, l'envoi échoue au bout de 5 s au lieu de 60 s
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer : un message JSON invalide ne bloque pas la partition
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.banque.order.infrastructure.in.kafka.OrderRequestMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.banque.order.infrastructure.in.kafka

springdoc:
  swagger-ui:
    path: /swagger-ui.html             # http://localhost:8080/swagger-ui.html
    url: /openapi/order-api.yaml       # API-first : Swagger affiche le CONTRAT, pas une doc déduite du code
  api-docs:
    path: /v3/api-docs

app:
  kafka:
    topics:
      order-requests: order-requests     # entrée : demandes de commande venant d'un autre système
      order-created: orders.created      # sortie : événement « commande créée »
  events:
    # outbox : l'événement est écrit en base avec la commande, puis publié par OutboxRelay (fiable)
    # direct : l'événement est envoyé immédiatement dans Kafka (version naïve, pour comparer)
    publication: outbox
  outbox:
    relay-interval-ms: 1000              # fréquence de passage du « facteur »
